# Include at http context, not inside an individual location.
# Existing ?v= tags are not content hashes: revalidate instead of trusting them.
map $status $zabvenye_static_cache_control {
    200     "private, no-cache, max-age=0, must-revalidate";
    304     "private, no-cache, max-age=0, must-revalidate";
    default "no-store";
}
