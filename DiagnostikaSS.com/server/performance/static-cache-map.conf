# Included by --map. At http context. The cache header must be set at server
# level with the existing security headers, not inside individual locations
# (Nginx 1.28 would otherwise stop inheriting those headers).
map "$zabvenye_static_asset:$request_method:$status" $zabvenye_static_cache_control {
    default      "no-store";
    "1:GET:200"  "private, no-cache, max-age=0, must-revalidate";
    "1:GET:304"  "private, no-cache, max-age=0, must-revalidate";
    "1:HEAD:200" "private, no-cache, max-age=0, must-revalidate";
    "1:HEAD:304" "private, no-cache, max-age=0, must-revalidate";
}
