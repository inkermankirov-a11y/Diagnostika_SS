name: Client specialist history audit

concurrency:
  group: client-specialist-history-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'feature-specialist-history-*', 'feature-specialist-row-*', 'feature-client-*']
    paths:
      - 'client-transfer.js'
      - 'index.html'
      - 'tests/client-specialist-history-20a-audit.mjs'
      - '.github/workflows/client-specialist-history-audit.yml'
  workflow_dispatch:

jobs:
  specialist-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          node --check client-transfer.js
          node --check tests/client-specialist-history-20a-audit.mjs

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify specialist history
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/specialist20a-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node tests/client-specialist-history-20a-audit.mjs
