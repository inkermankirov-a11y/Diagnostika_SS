name: Client card compact profile audit

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: DiagnostikaSS.com

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/client-card-compact-profile-audit.mjs
