name: Session module audit

on:
  push:
    branches: [main, feature-sessions-4a, feature-sessions-4b, feature-sessions-4c, feature-payment-5a, 'feature-payment-*', 'feature-ai-*', 'feature-files-*', 'feature-export-*', 'feature-roles-*', 'feature-api-*' ]
    paths:
      - 'modules/sessions/**'
      - 'session-api.js'
      - 'app-loader.js'
      - 'index.html'
      - 'tests/session-module-audit.mjs'
      - 'tests/session-ui-4b-audit.mjs'
      - 'tests/session-final-4c-audit.mjs'
      - 'test-data.js'
      - 'core/legacy-event-bridge.js'
      - 'core/bootstrap.js'
      - 'session-payment-data-repair.js'
      - 'session-payment-editor.js'
      - 'session-payment-ui-sync.js'
      - 'session-payment-button-authority.js'
      - 'payment-system.js'
      - 'payment-consistency-core.js'
      - 'payment-save-guard.js'
      - 'home-dashboard-sessions.js'
      - 'session-attachments.js'
      - 'session-interactions.js'
      - 'session-active-request.js'
      - 'session-format.js'
      - '.github/workflows/session-module-audit.yml'
  workflow_dispatch:

jobs:
  session-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static SessionService boundary check
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/sessions/session-service.js
          node --check modules/sessions/index.js
          node --check session-api.js
          node --check tests/session-module-audit.mjs
          node --check tests/session-ui-4b-audit.mjs
          node --check tests/session-final-4c-audit.mjs
          node --check test-data.js
          node --check core/legacy-event-bridge.js
          node --check core/bootstrap.js
          node --check session-payment-data-repair.js
          node --check session-payment-editor.js
          node --check session-payment-ui-sync.js
          node --check session-payment-button-authority.js
          node --check payment-system.js
          node --check payment-consistency-core.js
          node --check payment-save-guard.js
          node --check home-dashboard-sessions.js
          node --check session-attachments.js
          node --check session-interactions.js
          node --check session-active-request.js
          node --check session-format.js
          python3 - <<'PY'
          from pathlib import Path
          import sys,re

          service=Path('modules/sessions/session-service.js').read_text(encoding='utf-8')
          module=Path('modules/sessions/index.js').read_text(encoding='utf-8')
          api=Path('session-api.js').read_text(encoding='utf-8')
          loader=Path('app-loader.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          dashboard=Path('home-dashboard-sessions.js').read_text(encoding='utf-8')
          editor=Path('session-attachments.js').read_text(encoding='utf-8')
          interactions=Path('session-interactions.js').read_text(encoding='utf-8')
          active=Path('session-active-request.js').read_text(encoding='utf-8')
          format_ui=Path('session-format.js').read_text(encoding='utf-8')
          legacy=Path('core/legacy-event-bridge.js').read_text(encoding='utf-8')
          test_data=Path('test-data.js').read_text(encoding='utf-8')
          payment_paths=[
              'session-payment-data-repair.js',
              'session-payment-editor.js',
              'session-payment-ui-sync.js',
              'session-payment-button-authority.js',
              'payment-system.js',
              'payment-consistency-core.js',
              'payment-save-guard.js'
          ]
          payment_sources={p:Path(p).read_text(encoding='utf-8') for p in payment_paths}
          payment_link_paths={
              'session-payment-data-repair.js',
              'session-payment-editor.js',
              'session-payment-ui-sync.js',
              'session-payment-button-authority.js',
              'payment-consistency-core.js'
          }
          errors=[]

          if 'services.sessions=Object.freeze' not in service:
              errors.append('SessionService export missing')
          for token in ['function list(','function get(','function create(','function update(','function remove(','function forRequest(','function requestId(','function sessionNumber(','function refresh(']:
              if token not in service:
                  errors.append('SessionService method missing '+token)
          for forbidden in ['querySelector(', 'openSessionEditor', 'session-edit-dialog']:
              if forbidden in service:
                  errors.append('SessionService knows UI/HTML: '+forbidden)
          if "MODULE_ID='sessions'" not in module:
              errors.append('sessions module registration missing')
          if "version:'4C'" not in api or 'moduleAware:true' not in api:
              errors.append('session facade is not module-aware 4C')
          for token in [
              'modules/sessions/session-service.js?v=20260918-sessions4c',
              'modules/sessions/index.js?v=20260918-sessions4c',
              'session-api.js?v=20260918-sessions4c'
          ]:
              if token not in loader:
                  errors.append('session loader missing/stale: '+token)
          build_match=re.search(r'name="diagnostika-build" content="([^"]+)"',index)
          loader_match=re.search(r'app-loader[.]js[?]v=([^"&]+)',index)
          if not build_match:
              errors.append('diagnostika build marker missing')
          if not loader_match:
              errors.append('app-loader cache marker missing')
          if build_match and loader_match and build_match.group(1)!=loader_match.group(1):
              errors.append('build marker and app-loader cache marker differ')
          if 'c.sessions.push(' in dashboard:
              errors.append('dashboard still creates sessions directly')
          if "addEventListener('diagnostika:sessions-changed'" in dashboard:
              errors.append('dashboard still consumes legacy session DOM events directly')
          if "home-dashboard-session-create" not in dashboard:
              errors.append('dashboard SessionService create source missing')
          for token in ['s.date=','s.requestId=','s.notes=','s.youtubeUrl=']:
              if token in editor:
                  errors.append('session editor direct mutation: '+token)
          if "source:'session-editor-save'" not in editor:
              errors.append('session editor SessionService save missing')
          if 'c.sessions.splice(' in interactions:
              errors.append('session delete still splices client sessions')
          if "source: 'session-editor-delete'" not in interactions:
              errors.append('session delete SessionService source missing')
          if 's.requestId =' in active:
              errors.append('active-request bridge still mutates requestId directly')
          if "source:'session-active-request'" not in active:
              errors.append('active-request SessionService source missing')
          if re.search(r's\.sessionFormat\s*=(?!=)',format_ui) or "typeof save==='function'" in format_ui:
              errors.append('session format still owns session persistence')
          for token in ['diagnostika:sessions-changed','legacy-session-store','sessionSnapshots','resyncSessions']:
              if token in legacy:
                  errors.append('legacy bridge still owns sessions: '+token)
          if re.search(r'c\.sessions\s*=',test_data) or 'c.sessions.push(' in test_data or 'c.sessions.splice(' in test_data:
              errors.append('test-data still owns session storage')
          for token in ['test-data-session-reset','test-data-session-create','sessionApi.remove','sessionApi.create']:
              if token not in test_data:
                  errors.append('test-data SessionService boundary missing '+token)
          direct=re.compile(r'(?:\bs|\bsession|\bsessionNow|item\.session)\.requestId\s*=(?!=)')
          for path,src in payment_sources.items():
              if direct.search(src):
                  errors.append(path+' still mutates session.requestId directly')
              if path in payment_link_paths and 'DiagnostikaSessions' not in src and 'linkSessionRequest' not in src:
                  errors.append(path+' has no SessionService request-link boundary')
          print('SESSION_BOUNDARY_STATIC_ERRORS:',errors)
          if errors:
              sys.exit(1)
          PY
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify SessionService module foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/session-module-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node tests/session-module-audit.mjs
          node tests/session-ui-4b-audit.mjs
          node tests/session-final-4c-audit.mjs

# acceptance-ci-trigger: 20260918-sessions4c
