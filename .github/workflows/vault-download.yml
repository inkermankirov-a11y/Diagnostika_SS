name: Vault download reliability
on:
  push:
    branches: ['fix/vault-download-20261121', main]
    paths:
      - 'DiagnostikaSS.com/vault-backup.js'
      - 'DiagnostikaSS.com/vault-crypto.js'
      - 'DiagnostikaSS.com/tests/vault-download-browser.mjs'
      - '.github/workflows/vault-download.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: DiagnostikaSS.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/vault-download-browser.mjs
