name: Account registry audit
on:
  push:
    branches: [main, 'feature-license-mascot', 'feature-hcs-license', 'feature-vps-load', 'feature-admin-only-workspace', 'feature-notice-popup']
    paths:
      - 'DiagnostikaSS.com/server/accounts/**'
      - 'DiagnostikaSS.com/account-limits.js'
      - 'DiagnostikaSS.com/account-settings.js'
      - 'DiagnostikaSS.com/tests/account-refresh-policy.test.mjs'
      - '.github/workflows/account-registry-audit.yml'
  workflow_dispatch:
jobs:
  account-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile DiagnostikaSS.com/server/accounts/service.py
      - run: node --check DiagnostikaSS.com/server/accounts/ui.js
      - run: python3 DiagnostikaSS.com/server/accounts/test_registry.py
      - run: python3 DiagnostikaSS.com/server/accounts/test_load.py
      - run: node --check DiagnostikaSS.com/account-limits.js
      - run: node DiagnostikaSS.com/tests/account-refresh-policy.test.mjs
      - run: node --check DiagnostikaSS.com/account-settings.js
      - run: node DiagnostikaSS.com/tests/account-admin-only.test.mjs
      - run: node --check DiagnostikaSS.com/settings-menu.js
