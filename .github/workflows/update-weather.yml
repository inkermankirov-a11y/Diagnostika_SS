name: Update weather data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-weather.yml'
      - 'weather-locations.json'

permissions:
  contents: write

concurrency:
  group: weather-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch weather on GitHub
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          root=pathlib.Path('.')
          locations=json.loads((root/'weather-locations.json').read_text(encoding='utf-8'))['cities']
          endpoint='https://api.open-meteo.com/v1/forecast'
          rows=[]

          def fetch_batch(batch):
              params={
                  'latitude':','.join(str(city['latitude']) for city in batch),
                  'longitude':','.join(str(city['longitude']) for city in batch),
                  'current':'temperature_2m,apparent_temperature,weather_code,is_day',
                  'daily':'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max',
                  'forecast_days':7,
                  'temperature_unit':'celsius',
                  'wind_speed_unit':'kmh',
                  'timezone':'auto'
              }
              url=endpoint+'?'+urllib.parse.urlencode(params)
              error=None
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'DiagnostikaSS-weather/1.1'})
                      with urllib.request.urlopen(request,timeout=45) as response:
                          data=json.load(response)
                      if isinstance(data,dict):
                          data=[data]
                      if not isinstance(data,list) or len(data)!=len(batch):
                          raise RuntimeError(f'batch size mismatch: expected {len(batch)}, got {len(data) if isinstance(data,list) else "invalid"}')
                      return data
                  except Exception as exc:
                      error=exc
                      time.sleep(2*(attempt+1))
              raise RuntimeError(f'weather batch failed: {error}')

          batch_size=25
          for start in range(0,len(locations),batch_size):
              batch=locations[start:start+batch_size]
              payloads=fetch_batch(batch)
              for city,data in zip(batch,payloads):
                  if not isinstance(data.get('current'),dict):
                      raise RuntimeError(f"{city['id']}: current missing")
                  if not isinstance(data.get('daily',{}).get('time'),list) or len(data['daily']['time'])<7:
                      raise RuntimeError(f"{city['id']}: daily.time missing")
                  rows.append({
                      **city,
                      'timezone':data.get('timezone') or city.get('timezone') or 'auto',
                      'current':data['current'],
                      'daily':data['daily']
                  })

          existing=None
          target=root/'weather-data.json'
          if target.exists():
              try:
                  existing=json.loads(target.read_text(encoding='utf-8'))
              except Exception:
                  existing=None

          reference=next((city for city in rows if city.get('id')=='kirov'),rows[0])
          payload={
              '_updated_utc':dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'current':reference['current'],
              'daily':reference['daily'],
              'cities':rows
          }

          if existing and existing.get('cities')==rows:
              print('Weather values unchanged; refresh timestamp only.')
          else:
              print(f"Updated {len(rows)} cities in {(len(rows)+batch_size-1)//batch_size} API batches.")
          target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate weather-data.json
        run: |
          python - <<'PY'
          import json
          data=json.load(open('weather-data.json',encoding='utf-8'))
          if data.get('current',{}).get('temperature_2m') is None:
              raise SystemExit('top-level current.temperature_2m missing')
          if len(data.get('daily',{}).get('time') or []) < 7:
              raise SystemExit('top-level daily.time missing')
          cities=data.get('cities') or []
          if not cities:
              raise SystemExit('weather cities missing')
          for city in cities:
              if city.get('current',{}).get('temperature_2m') is None:
                  raise SystemExit(f"current.temperature_2m missing for {city.get('id')}")
              if len(city.get('daily',{}).get('time') or []) < 7:
                  raise SystemExit(f"7-day forecast missing for {city.get('id')}")
          print(f"Validated {len(cities)} cities.")
          PY

      - name: Commit changed weather data
        run: |
          git add weather-data.json
          if git diff --cached --quiet; then
            echo "Weather data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update weather data"
          git push origin HEAD:main
