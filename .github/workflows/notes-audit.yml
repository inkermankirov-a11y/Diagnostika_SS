name: Notes scope and sync audit

on:
  push:
    branches: [main, 'feature-notes-*']
    paths:
      - 'DiagnostikaSS.com/quick-notes.js'
      - 'DiagnostikaSS.com/modules/ai/ui/client-chat.js'
      - 'DiagnostikaSS.com/google-drive-merge-worker.js'
      - 'DiagnostikaSS.com/storage-simple-sync.js'
      - 'DiagnostikaSS.com/index.html'
      - 'DiagnostikaSS.com/tests/notes-*.mjs'
      - '.github/workflows/notes-audit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: DiagnostikaSS.com

jobs:
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static notes checks
        shell: bash
        run: |
          set -euo pipefail
          node --check quick-notes.js
          node --check modules/ai/ui/client-chat.js
          node --check tests/notes-17a-audit.mjs

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify NOTES 17A runtime and sync boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/notes17a-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node tests/notes-17a-audit.mjs
