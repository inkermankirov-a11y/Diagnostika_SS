name: Dashboard reminder persistence audit

on:
  push:
    branches: [main, 'feature-dashboard-*', 'fix-dashboard-*', 'feature-client-*', 'feature-diagnosis-*']
    paths:
      - 'home-dashboard.js'
      - 'home-dashboard.css'
      - 'app-loader.js'
      - 'tests/dashboard-reminder-persistence-audit.mjs'
      - 'tests/dashboard-diagnosis-beacon-audit.mjs'
      - '.github/workflows/dashboard-reminder-persistence-audit.yml'
  workflow_dispatch:

jobs:
  reminder-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run persistent reminder audit
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/reminder-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node tests/dashboard-reminder-persistence-audit.mjs
          node tests/dashboard-diagnosis-beacon-audit.mjs
