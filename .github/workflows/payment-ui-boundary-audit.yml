name: Payment UI boundary audit

on:
  push:
    branches: [main, 'feature-payment-*']
    paths:
      - 'DiagnostikaSS.com/payment-api.js'
      - 'DiagnostikaSS.com/index.html'
      - 'DiagnostikaSS.com/app-loader.js'
      - 'DiagnostikaSS.com/modules/payments/ui/**'
      - 'DiagnostikaSS.com/tests/payment-ui-boundary-*.mjs'
      - '.github/workflows/payment-ui-boundary-audit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: DiagnostikaSS.com

jobs:
  payment-ui-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify modular Payment UI ownership
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/payment-ui-boundary-25a-audit.mjs
          node tests/payment-ui-boundary-25a-audit.mjs
