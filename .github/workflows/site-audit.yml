name: Site audit

on:
  push:
    branches: [main, retire-old-interface, feature-requests-3a, feature-requests-3b, feature-requests-3c, feature-requests-3d, feature-sessions-4a, feature-sessions-4b, feature-sessions-4c, 'feature-payment-*', 'feature-ai-*' ]
    paths:
      - '**.js'
      - '**.css'
      - 'index.html'
      - '.github/workflows/site-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static audit
        shell: bash
        run: |
          set -uo pipefail
          failed=0; count=0
          while IFS= read -r -d '' f; do
            count=$((count+1)); node --check "$f" || failed=$((failed+1))
          done < <(find . -type f -name '*.js' -print0)
          echo "Checked $count JS files; failures=$failed"
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.'); html=(root/'index.html').read_text(encoding='utf-8')
          refs=re.findall(r'''(?:src|href)=["']([^"']+)["']''',html)
          missing=[]
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')): continue
              p=ref.split('?',1)[0].split('#',1)[0]
              if p and not (root/p).exists(): missing.append(p)
          scripts=[x.split('?',1)[0] for x in re.findall(r'''<script[^>]+src=["']([^"']+)["']''',html)]
          dup=sorted({x for x in scripts if scripts.count(x)>1})
          dash=(root/'home-dashboard.js').read_text(encoding='utf-8')
          legacy_ids=['clientBaseBtn','clientCardModeBtn','addClientBtn']
          legacy_refs=[x for x in legacy_ids if x in dash]
          print('Local refs:',len(refs),'Missing:',missing or 'none','Duplicate index scripts:',dup or 'none','Dashboard legacy refs:',legacy_refs or 'none')
          if missing or dup or legacy_refs: sys.exit(1)
          PY
          test "$failed" -eq 0
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full browser audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          cat > diag-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});

          async function instrument(page){
            await page.addInitScript(()=>{
              const Native=window.MutationObserver, stats=[]; window.__moStats=stats;
              window.MutationObserver=class extends Native{
                constructor(cb){
                  const row={stack:String(new Error().stack||''),count:0,records:0};stats.push(row);
                  super((r,o)=>{row.count++;row.records+=r?.length||0;return cb(r,o);});
                }
              };
            });
          }
          async function ready(page){
            await page.waitForFunction(()=>document.readyState!=='loading',null,{timeout:25000});
            await page.locator('#settingsMenuBtn').waitFor({state:'visible',timeout:8000});
            await page.locator('.home-dashboard').waitFor({state:'visible',timeout:8000});
          }
          const duplicateAssets=async page=>page.evaluate(()=>{
            const names=[...document.scripts].map(s=>s.src).filter(Boolean).map(src=>new URL(src).pathname);
            const scripts=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))].sort();
            const cssNames=[...document.styleSheets].map(s=>s.href).filter(Boolean).map(src=>new URL(src).pathname);
            const css=[...new Set(cssNames.filter((n,i)=>cssNames.indexOf(n)!==i))].sort();
            return {scripts,css};
          });

          for(let i=1;i<=3;i++){
            const c=await browser.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();await instrument(p);
            const t=Date.now();await p.goto(`http://127.0.0.1:8000/index.html?cold=${i}-${t}`,{waitUntil:'commit',timeout:10000});await ready(p);await p.waitForTimeout(1500);
            const ms=Date.now()-t;
            const assets=await duplicateAssets(p);
            const top=await p.evaluate(()=>(window.__moStats||[]).map(x=>({source:(x.stack.split('\n').find(v=>/\.js/.test(v))||'unknown').trim(),count:x.count,records:x.records})).sort((a,b)=>b.count-a.count).slice(0,8));
            console.log(`COLD_LOAD_${i}: ${ms}ms`);console.log(`DUPLICATE_ASSETS_${i}: ${JSON.stringify(assets)}`);console.log(`MO_TOP_${i}: ${JSON.stringify(top)}`);
            if(assets.scripts.length||assets.css.length)throw new Error(`Duplicate runtime assets on cold load ${i}: ${JSON.stringify(assets)}`);
            if(ms>20000)throw new Error(`Cold load ${i} too slow`);await c.close();
          }

          // Separate dependency check: exercise only the new dashboard actions and
          // prove they do not click the legacy hidden client buttons.
          const depContext=await browser.newContext({viewport:{width:1440,height:1000}}),dep=await depContext.newPage();await instrument(dep);
          await dep.goto(`http://127.0.0.1:8000/index.html?dep=${Date.now()}`,{waitUntil:'commit',timeout:10000});await ready(dep);
          await dep.waitForFunction(()=>!!window.DiagnostikaClients?.current?.());
          await dep.evaluate(()=>document.getElementById('testFillBtn')?.click());
          await dep.locator('.diagnosis-compact-back').waitFor({state:'visible',timeout:5000});
          await dep.locator('.diagnosis-compact-back').click();
          await dep.locator('.home-dashboard').waitFor({state:'visible',timeout:3000});
          await dep.evaluate(()=>window.DiagnostikaHomeDashboard?.refresh?.());
          await dep.locator('.hd-client-row').first().waitFor({state:'attached',timeout:3000});
          await dep.evaluate(()=>{
            window.__legacyDashboardClicks=[];
            for(const id of ['clientBaseBtn','clientCardModeBtn','addClientBtn']){
              const el=document.getElementById(id);
              if(el)el.addEventListener('click',()=>window.__legacyDashboardClicks.push(id),true);
            }
          });
          const cardOpened=await dep.evaluate(()=>{const b=[...document.querySelectorAll('#hdHeroActions button')].find(x=>x.textContent.includes('Карточка клиента'));if(!b)return false;b.click();return true;});
          if(!cardOpened)throw new Error('Dashboard client-card action missing');
          await dep.locator('#clientCardDialog').waitFor({state:'visible',timeout:3000});
          await dep.evaluate(()=>document.getElementById('clientCardDialog')?.close());
          await dep.locator('#clientCardDialog').waitFor({state:'hidden',timeout:3000});
          await dep.evaluate(()=>window.DiagnostikaHomeDashboard?.refresh?.());
          // client-list-cleanup.js intentionally removes the row's transient three-dot button.
          // Test the dashboard's public client-database action instead of racing that cleanup.
          const dbOpened=await dep.evaluate(()=>{const api=window.DiagnostikaHomeDashboard;if(!api||typeof api.openClientDatabase!=='function')return false;api.openClientDatabase();return true;});
          if(!dbOpened)throw new Error('Dashboard client-database API missing');
          await dep.locator('#clientDialog').waitFor({state:'visible',timeout:3000});
          await dep.evaluate(()=>document.getElementById('clientDialog')?.close());
          await dep.locator('#clientDialog').waitFor({state:'hidden',timeout:3000});
          const newOpened=await dep.evaluate(()=>{const b=document.getElementById('hdAddClient');if(!b)return false;b.click();return true;});
          if(!newOpened)throw new Error('Dashboard new-client action missing');
          await dep.locator('#clientCardDialog').waitFor({state:'visible',timeout:3000});
          const legacyClicks=await dep.evaluate(()=>window.__legacyDashboardClicks||[]);
          console.log('DASHBOARD_LEGACY_BUTTON_CLICKS:',JSON.stringify(legacyClicks));
          if(legacyClicks.length)throw new Error(`Dashboard client actions used legacy buttons: ${legacyClicks.join(',')}`);
          await depContext.close();

          const context=await browser.newContext({viewport:{width:1440,height:1000}}),page=await context.newPage();await instrument(page);
          const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});page.on('dialog',d=>d.accept().catch(()=>{}));
          const shot=async n=>page.screenshot({path:`/tmp/${n}.png`,fullPage:true});
          await page.goto(`http://127.0.0.1:8000/index.html?audit=${Date.now()}`,{waitUntil:'commit',timeout:10000});await ready(page);await page.waitForTimeout(800);await shot('01-loaded');

          const oldWorkspace=page.locator('#diagnosisWorkspace');
          if(await oldWorkspace.isVisible())throw new Error('Legacy workspace visible on dashboard');

          const openSettings=async()=>{if(!(await page.locator('#settingsPanel').isVisible())){await page.locator('#settingsMenuBtn').click();await page.locator('#settingsPanel').waitFor({state:'visible'});}};
          await openSettings();await shot('02-settings');
          await page.locator('.settings-accounts-btn').click();await page.locator('.settings-account-content.open').waitFor({state:'visible'});await shot('03-accounts');
          if(await page.locator('#formIntegrationsBtn').count()){await page.locator('#formIntegrationsBtn').click();await page.locator('#formIntegrationsDialog').waitFor({state:'visible'});await page.locator('#fiClose').click();}
          await openSettings();await page.locator('.settings-interface-btn').click();await page.locator('.settings-interface-content.open').waitFor({state:'visible'});await shot('04-interface');
          await page.locator('#storageBtn').click();await page.locator('.storage-dialog').waitFor({state:'visible'});await shot('05-storage');if(await page.locator('#storageClose').count())await page.locator('#storageClose').click();else await page.keyboard.press('Escape');
          await page.locator('#clientBaseBtn').click();await page.locator('#clientDialog').waitFor({state:'visible'});await shot('06-client-db');await page.keyboard.press('Escape');

          await page.waitForFunction(()=>!!window.DiagnostikaClients?.current?.());await page.evaluate(()=>document.getElementById('testFillBtn')?.click());await page.waitForTimeout(500);
          const name=(await page.evaluate(()=>window.DiagnostikaClients.current()?.name||'')).trim();if(!name||name==='Новый клиент')throw new Error('Test client not populated');
          if((await page.locator('#requestSelect option').count())<1)throw new Error('No requests');if((await page.locator('#situationList .situation-item').count())<1)throw new Error('No situations');if((await page.locator('#tree .tree-row').count())<1)throw new Error('No diagnosis tree');await shot('07-diagnosis');
          const belief=page.locator('#tree .tree-row.primary').first();await belief.click();await page.locator('#editorText').fill('Аудит: тестовое убеждение');await page.locator('#saveElementBtn').click();await page.waitForTimeout(100);if(!(await belief.textContent())?.includes('Аудит: тестовое убеждение'))throw new Error('Diagnosis edit failed');

          await page.locator('.diagnosis-compact-back').click();await page.locator('.home-dashboard').waitFor({state:'visible',timeout:3000});
          if(await oldWorkspace.isVisible())throw new Error('Legacy workspace visible after returning from diagnosis');
          await page.locator('#hdClientAiWidget').waitFor({state:'visible',timeout:5000});
          if((await page.locator('#hdClientAiWidget .hd-ai-clear-btn').count())!==1)throw new Error('Client AI clear button missing or duplicated');
          const before=await page.evaluate(()=>{const x=JSON.parse(localStorage.getItem('diagnostika-web-v1')||'null');const id=window.DiagnostikaClients?.currentId?.();return x?.clients?.find(c=>String(c.id)===String(id))?.sessions?.length||0;});
          await page.locator('#hdAddSession').waitFor({state:'visible',timeout:5000});await page.locator('#hdAddSession').click();
          const sessionDialog=page.locator('dialog.session-edit-dialog');await sessionDialog.waitFor({state:'visible',timeout:5000});
          await sessionDialog.locator('.session-ai-box').waitFor({state:'visible',timeout:5000});
          if((await sessionDialog.locator('.session-ai-clear').count())!==1)throw new Error('Session AI clear button missing or duplicated');
          if((await sessionDialog.locator('.session-ai-mode button').count())!==2)throw new Error('Session AI modes missing');
          await shot('08-session-ai');
          await page.evaluate(()=>document.querySelector('dialog.session-edit-dialog')?.close());
          await sessionDialog.waitFor({state:'hidden',timeout:3000});
          const after=await page.evaluate(()=>{const x=JSON.parse(localStorage.getItem('diagnostika-web-v1')||'null');const id=window.DiagnostikaClients?.currentId?.();return x?.clients?.find(c=>String(c.id)===String(id))?.sessions?.length||0;});
          if(after!==before+1)throw new Error(`Session persistence failed: before=${before}, after=${after}`);await shot('09-dashboard');

          const assets=await duplicateAssets(page);console.log('RUNTIME_DUPLICATE_ASSETS:',JSON.stringify(assets));
          if(assets.scripts.length||assets.css.length)throw new Error(`Duplicate runtime assets: ${JSON.stringify(assets)}`);
          const raf=[];for(let i=0;i<5;i++)raf.push(await page.evaluate(()=>new Promise(r=>{const s=performance.now();requestAnimationFrame(()=>r(performance.now()-s))})));console.log('RAF_LATENCY_MS:',JSON.stringify(raf));if(Math.max(...raf)>1200)throw new Error('Main thread slow');
          const top=await page.evaluate(()=>(window.__moStats||[]).map(x=>({source:(x.stack.split('\n').find(v=>/\.js/.test(v))||'unknown').trim(),count:x.count,records:x.records})).sort((a,b)=>b.count-a.count).slice(0,15));console.log('MO_FINAL_TOP:',JSON.stringify(top));
          fs.writeFileSync('/tmp/browser-errors.txt',errors.join('\n'));console.log('Browser errors:',JSON.stringify(errors));const serious=errors.filter(x=>!x.includes('Failed to fetch')&&!x.includes('ERR_')&&!x.includes('favicon'));if(serious.length)throw new Error(serious.join(' | '));
          await browser.close();
          JS
          node diag-audit.mjs
      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-screenshots
          path: |
            /tmp/01-loaded.png
            /tmp/02-settings.png
            /tmp/03-accounts.png
            /tmp/04-interface.png
            /tmp/05-storage.png
            /tmp/06-client-db.png
            /tmp/07-diagnosis.png
            /tmp/08-session-ai.png
            /tmp/09-dashboard.png
            /tmp/browser-errors.txt
          if-no-files-found: ignore
