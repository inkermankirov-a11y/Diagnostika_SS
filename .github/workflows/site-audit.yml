name: Site audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.css'
      - 'index.html'
      - '.github/workflows/site-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' f; do
            count=$((count+1))
            if ! node --check "$f"; then
              failed=$((failed+1))
              echo "SYNTAX_ERROR: $f"
            fi
          done < <(find . -type f -name '*.js' -print0)
          echo "Checked $count JavaScript files; syntax failures: $failed"
          test "$failed" -eq 0

      - name: Check references and risky loops
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          refs=re.findall(r'''(?:src|href)=["']([^"']+)["']''',html)
          missing=[]
          for ref in refs:
              if ref.startswith(('http://','https://','data:','#')): continue
              p=ref.split('?',1)[0].split('#',1)[0]
              if p and not (root/p).exists(): missing.append((ref,p))
          scripts=re.findall(r'''<script[^>]+src=["']([^"']+)["']''',html)
          base=[x.split('?',1)[0] for x in scripts]
          dup=sorted({x for x in base if base.count(x)>1})
          dynamic_missing=[]
          for f in root.rglob('*.js'):
              text=f.read_text(encoding='utf-8',errors='replace')
              for m in re.finditer(r'''["']([A-Za-z0-9._/-]+\.js)(?:\?[^"']*)?["']''',text):
                  p=m.group(1)
                  if not (root/p).exists(): dynamic_missing.append((str(f),p))
          print('Local refs:',len(refs))
          print('Duplicate direct scripts:',dup or 'none')
          print('Missing refs:',missing or 'none')
          print('Missing dynamic JS:',dynamic_missing or 'none')
          body_observers=[]; intervals=[]
          for f in root.rglob('*.js'):
              text=f.read_text(encoding='utf-8',errors='replace')
              if re.search(r'\.observe\s*\(\s*document\.(?:body|documentElement)\s*,[^)]*subtree\s*:\s*true',text,re.S): body_observers.append(str(f))
              if re.search(r'\bsetInterval\s*\(',text): intervals.append(str(f))
          print('Whole-document subtree observers:',body_observers)
          print('setInterval files:',intervals)
          if missing or dynamic_missing: sys.exit(1)

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/diag-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > ./diag-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},permissions:[]});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('console',m=>{if(m.type()==='error') errors.push(`console: ${m.text()}`);});
          const shot=async n=>{await page.screenshot({path:`/tmp/${n}.png`,fullPage:true});console.log('MARK',n);};

          await page.goto(`http://127.0.0.1:8000/index.html?audit=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:15000});
          await page.waitForTimeout(3500);
          await page.locator('#settingsMenuBtn').waitFor({state:'visible',timeout:7000});
          await shot('01-loaded');

          await page.locator('#settingsMenuBtn').click();
          await page.locator('#settingsPanel').waitFor({state:'visible',timeout:3000});
          await shot('02-settings');

          await page.locator('.settings-accounts-btn').click();
          await page.locator('.settings-account-content.open').waitFor({state:'visible',timeout:3000});
          await shot('03-accounts');

          const forms=page.locator('#formIntegrationsBtn');
          if(await forms.count()){
            await forms.click();
            await page.locator('#formIntegrationsDialog').waitFor({state:'visible',timeout:3000});
            await page.locator('#fiClose').click();
          }

          await page.locator('.settings-interface-btn').click();
          await page.locator('.settings-interface-content.open').waitFor({state:'visible',timeout:3000});
          await shot('04-interface');

          await page.locator('#storageBtn').click();
          const storage=page.locator('.storage-dialog');
          await storage.waitFor({state:'visible',timeout:3000});
          await shot('05-storage');
          const storageClose=page.locator('#storageClose');
          if(await storageClose.count()) await storageClose.click(); else await page.keyboard.press('Escape');

          await page.locator('#clientBaseBtn').click();
          await page.locator('#clientDialog').waitFor({state:'visible',timeout:3000});
          await shot('06-client-db');
          await page.keyboard.press('Escape');

          const calc=page.locator('#headerCalculatorBtn');
          if(await calc.count()){
            await calc.click();
            await page.locator('#standaloneCalculatorOverlay:not([hidden])').waitFor({state:'visible',timeout:3000});
            const input=page.locator('.standalone-calc-expression');
            await input.fill('2+2');
            await input.press('Enter');
            const result=(await page.locator('.standalone-calc-result').textContent())?.trim();
            if(result!=='4') throw new Error(`Calculator failed: ${result}`);
            await page.locator('.standalone-calc-close').click();
          }

          const responsive=await page.evaluate(()=>new Promise(resolve=>{const s=performance.now();requestAnimationFrame(()=>resolve(performance.now()-s<1200));}));
          if(!responsive) throw new Error('Main thread responsiveness check failed');
          fs.writeFileSync('/tmp/browser-errors.txt',errors.join('\n'));
          console.log('Browser errors:',JSON.stringify(errors,null,2));
          const serious=errors.filter(x=>!x.includes('Failed to fetch')&&!x.includes('ERR_')&&!x.includes('favicon'));
          if(serious.length) throw new Error('Browser errors detected: '+serious.join(' | '));
          await browser.close();
          JS
          node ./diag-smoke.mjs

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-screenshots
          path: |
            /tmp/01-loaded.png
            /tmp/02-settings.png
            /tmp/03-accounts.png
            /tmp/04-interface.png
            /tmp/05-storage.png
            /tmp/06-client-db.png
            /tmp/browser-errors.txt
          if-no-files-found: ignore
