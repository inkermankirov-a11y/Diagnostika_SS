name: Client module audit

on:
  push:
    branches: [ main, feature-clients-2a, feature-clients-2b1, feature-clients-2b2 ]
    paths:
      - 'modules/clients/**'
      - 'client-api.js'
      - 'client-card-window.js'
      - 'delete-client.js'
      - 'client-trash.js'
      - 'client-db-enhancements.js'
      - 'app-loader.js'
      - 'index.html'
      - 'tests/client-module-audit.mjs'
      - 'tests/client-write-audit.mjs'
      - 'tests/client-trash-audit.mjs'
      - '.github/workflows/client-module-audit.yml'
  workflow_dispatch:

jobs:
  client-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static client module check
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/clients/client-service.js
          node --check modules/clients/index.js
          node --check client-api.js
          node --check client-card-window.js
          node --check delete-client.js
          node --check client-trash.js
          node --check client-db-enhancements.js
          node --check app-loader.js
          node --check tests/client-module-audit.mjs
          node --check tests/client-write-audit.mjs
          node --check tests/client-trash-audit.mjs
          python3 - <<'PY'
          from pathlib import Path
          import sys
          service=Path('modules/clients/client-service.js').read_text(encoding='utf-8')
          module=Path('modules/clients/index.js').read_text(encoding='utf-8')
          api=Path('client-api.js').read_text(encoding='utf-8')
          card=Path('client-card-window.js').read_text(encoding='utf-8')
          delete_client=Path('delete-client.js').read_text(encoding='utf-8')
          trash=Path('client-trash.js').read_text(encoding='utf-8')
          db=Path('client-db-enhancements.js').read_text(encoding='utf-8')
          loader=Path('app-loader.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          errors=[]
          for token in ["created: 'client:created'","selected: 'client:selected'","updated: 'client:updated'","deleted: 'client:deleted'","restored: 'client:restored'"]:
              if token not in service: errors.append('service contract missing '+token)
          for token in ['function create(', 'function update(', 'function trashList(', 'function remove(', 'function restore(', 'function purge(', 'create,', 'update,', 'trashList,', 'remove,', 'restore,', 'purge']:
              if token not in service: errors.append('client lifecycle service missing '+token)
          if "id: MODULE_ID" not in module or "const MODULE_ID = 'clients'" not in module: errors.append('clients module registration missing')
          if "roles: ['specialist', 'admin']" not in module: errors.append('clients module roles missing')
          if 'moduleAware:true' not in api: errors.append('module-aware compatibility facade missing')
          if "version:'2B2'" not in api: errors.append('client facade version is stale')
          for token in ['create,','update,','trashList,','remove,','restore,','purge,']:
              if token not in api: errors.append('client facade lifecycle method missing '+token)
          if 'state.clients.push' in card: errors.append('client card still pushes directly into state.clients')
          if "emit('client:created'" in card or "emit('client:updated'" in card: errors.append('client card still emits write events directly')
          if 'api.create?.' not in card or 'api.update?.' not in card: errors.append('client card does not use client service facade')
          if 'state.deletedClients' in trash or 'state.deletedClientTombstones' in trash: errors.append('trash UI still mutates trash state directly')
          if 'new MutationObserver' in trash: errors.append('trash UI still installs a global MutationObserver')
          if 'state.clients' in delete_client or 'deletedClients' in delete_client: errors.append('delete compatibility layer still owns client data')
          if 'clientId=' in db.replace('===','').replace('!==',''): errors.append('enhanced database still assigns clientId directly')
          if "clientsApi()?.select?.(c.id,{source:'client-database-open'})" not in db: errors.append('enhanced database does not select through client facade')
          if 'modules/clients/client-service.js?v=20260918-clients2b2' not in loader: errors.append('client service cache version is stale')
          if 'modules/clients/index.js?v=20260918-clients2b2' not in loader: errors.append('clients module cache version is stale')
          if 'client-api.js?v=20260918-clients2b2' not in loader: errors.append('client API cache version is stale')
          if 'client-card-window.js?v=20260918-clients2b1' not in index: errors.append('client card cache version is stale')
          if 'delete-client.js?v=20260918-clients2b2' not in index: errors.append('delete-client cache version is stale')
          if 'client-db-enhancements.js?v=20260918-clients2b2' not in index: errors.append('client DB cache version is stale')
          if 'client-trash.js?v=20260918-clients2b2' not in index: errors.append('client trash cache version is stale')
          if 'app-loader.js?v=20260918-clients2b2' not in index: errors.append('app loader cache version is stale')
          if 'diagnostika-build" content="20260918-clients2b2' not in index: errors.append('build marker is stale')
          print('CLIENT_MODULE_STATIC_ERRORS:',errors)
          if errors: sys.exit(1)
          PY
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify client module compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-module-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node tests/client-module-audit.mjs
      - name: Verify client card create flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-write-create-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_WRITE_PHASE=create node tests/client-write-audit.mjs
      - name: Verify client card update flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-write-update-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_WRITE_PHASE=update node tests/client-write-audit.mjs
      - name: Verify legacy database create flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-write-legacy-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_WRITE_PHASE=legacy node tests/client-write-audit.mjs

      - name: Verify trash non-current delete and restore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-noncurrent-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=noncurrent node tests/client-trash-audit.mjs
      - name: Verify current client delete state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-current-state-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=current-state node tests/client-trash-audit.mjs
      - name: Verify current client delete remembered selection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-current-remember-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=current-remember node tests/client-trash-audit.mjs
      - name: Verify current client delete event
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-current-event-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=current-event node tests/client-trash-audit.mjs
      - name: Verify trash and database UI lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-ui-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=ui node tests/client-trash-audit.mjs
      - name: Verify last client replacement and reload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/client-trash-last-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          CLIENT_TRASH_PHASE=last node tests/client-trash-audit.mjs
