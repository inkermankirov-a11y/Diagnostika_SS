name: Final Stage 9 boundary audit

on:
  push:
    branches: [ main, 'feature-final-*' ]
    paths:
      - 'DiagnostikaSS.com/client-ai-full-context.js'
      - 'DiagnostikaSS.com/client-ai-chat-view.js'
      - 'DiagnostikaSS.com/ai-processing-indicator.js'
      - 'DiagnostikaSS.com/request-ai-n8n.js'
      - 'DiagnostikaSS.com/modules/ai/**'
      - 'DiagnostikaSS.com/free-consultation-v2.js'
      - 'DiagnostikaSS.com/free-consultation-client-card-sync.js'
      - 'DiagnostikaSS.com/manual-questionnaire-template.js'
      - 'DiagnostikaSS.com/modules/requests/**'
      - 'DiagnostikaSS.com/modules/clients/**'
      - 'DiagnostikaSS.com/index.html'
      - 'DiagnostikaSS.com/tests/*boundary*'
      - '.github/workflows/final-stage9-boundary-audit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: DiagnostikaSS.com

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check client-ai-full-context.js
          node --check client-ai-chat-view.js
          node --check ai-processing-indicator.js
          node --check request-ai-n8n.js
          node --check modules/ai/ai-transport.js
          node --check free-consultation-v2.js
          node --check free-consultation-client-card-sync.js
          node --check manual-questionnaire-template.js
          node --check tests/final-stage9-boundary-audit.mjs

      - name: Historical module boundaries
        run: |
          node tests/client-ui-boundary-stage5-audit.mjs
          node tests/request-ui-boundary-stage6-audit.mjs
          node tests/ai-ui-boundary-stage7-audit.mjs
          node tests/calendar-ui-boundary-stage8-audit.mjs

      - name: Final Stage 9 boundary
        run: node tests/final-stage9-boundary-audit.mjs
