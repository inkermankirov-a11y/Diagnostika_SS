name: Calendar API audit

on:
  push:
    branches: [main, 'feature-calendar-*', 'feature-ai-*', 'feature-files-*', 'feature-export-*', 'feature-roles-*', 'feature-api-*' ]
    paths:
      - 'modules/calendar/**'
      - 'calendar-api.js'
      - 'client-calendar.js'
      - 'calendar-session-planning.js'
      - 'calendar-google-link.js'
      - 'app-loader.js'
      - 'index.html'
      - 'tests/calendar-module-8a-audit.mjs'
      - 'tests/calendar-ui-8b-audit.mjs'
      - 'tests/calendar-session-8c-audit.mjs'
      - 'tests/calendar-hardening-8d-audit.mjs'
      - '.github/workflows/calendar-api-audit.yml'
  workflow_dispatch:

jobs:
  calendar-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static CalendarService boundary check
        shell: bash
        run: |
          set -euo pipefail
          node --check modules/calendar/calendar-service.js
          node --check modules/calendar/index.js
          node --check calendar-api.js
          node --check client-calendar.js
          node --check calendar-session-planning.js
          node --check calendar-google-link.js
          node --check app-loader.js
          node --check tests/calendar-module-8a-audit.mjs
          node --check tests/calendar-ui-8b-audit.mjs
          node --check tests/calendar-session-8c-audit.mjs
          node --check tests/calendar-hardening-8d-audit.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re,sys

          service=Path('modules/calendar/calendar-service.js').read_text(encoding='utf-8')
          module=Path('modules/calendar/index.js').read_text(encoding='utf-8')
          api=Path('calendar-api.js').read_text(encoding='utf-8')
          loader=Path('app-loader.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          ui=Path('client-calendar.js').read_text(encoding='utf-8')
          planning=Path('calendar-session-planning.js').read_text(encoding='utf-8')
          google=Path('calendar-google-link.js').read_text(encoding='utf-8')
          errors=[]

          if 'services.calendar=Object.freeze' not in service:
              errors.append('CalendarService export missing')
          for token in [
              'function list(','function get(','function forDate(','function forClient(',
              'function create(','function update(','function remove(','function replace('
          ]:
              if token not in service:
                  errors.append('CalendarService method missing '+token)
          for forbidden in ['querySelector(', 'diagnostikaCalendarOverlay', '.cal-']:
              if forbidden in service:
                  errors.append('CalendarService knows UI/HTML: '+forbidden)
          if "typeof save==='function'" in service:
              errors.append('CalendarService calls global save directly')
          if 'platform.store?.legacySave?.()===true' not in service:
              errors.append('CalendarService does not persist through store bridge')
          if "MODULE_ID='calendar'" not in module:
              errors.append('calendar module registration missing')
          if "version:'8D'" not in api or 'moduleAware:true' not in api:
              errors.append('calendar facade is not module-aware 8D')
          if 'window.DiagnostikaCalendar=Object.freeze({' not in api:
              errors.append('calendar facade is not frozen')
          for token in [
              'modules/calendar/calendar-service.js?v=20260919-calendar8a',
              'modules/calendar/index.js?v=20260919-calendar8a',
              'calendar-api.js?v=20260919-calendar8d'
          ]:
              if token not in loader:
                  errors.append('calendar loader missing/stale: '+token)
          if 'loadCalendarApi()' not in loader:
              errors.append('calendar API is not in application loader chain')
          build_match=re.search(r'name="diagnostika-build" content="([^"]+)"',index)
          loader_match=re.search(r'app-loader[.]js[?]v=([^"]+)',index)
          if not build_match or not loader_match:
              errors.append('calendar build/app-loader marker missing')
          elif build_match.group(1)!=loader_match.group(1):
              errors.append('build marker and app-loader cache marker differ')
          elif not re.fullmatch(r'20260919-(?:calendar8d|files9[a-d]|export10[a-d]|roles11[a-d])',build_match.group(1)):
              errors.append('calendar-compatible global loader marker is stale')

          for token in ['customEvents().push(item)', '.splice(idx,1)', "typeof save==='function'"]:
              if token in ui:
                  errors.append('calendar UI direct writer remains: '+token)
          for token in ["source:'calendar-ui-create'","source:'calendar-ui-delete'","api.create(item","api.remove(e.id"]:
              if token not in ui:
                  errors.append('calendar 8B UI service boundary missing '+token)
          if 'normalizePlannedSessions' not in planning:
              errors.append('calendar session planning baseline missing')
          if "version:'8C'" not in planning:
              errors.append('calendar session planning is not 8C')
          for token in [
              "sessionsApi()?.forRequest?.(r.id,c)",
              "api.list({clientId:c.id})",
              "api.update(e.id,patch,{source:'calendar-session-linkage'})",
              "'session:created'","'session:updated'","'session:deleted'"
          ]:
              if token not in planning:
                  errors.append('calendar 8C session linkage missing '+token)
          for forbidden in ["typeof save==='function'", 'st.calendarEvents', 'e.sessionNumber=', 'e.requestId=']:
              if forbidden in planning:
                  errors.append('calendar 8C legacy mutation remains: '+forbidden)
          if 'calendar-session-planning.js?v=20260919-calendar8c' not in index:
              errors.append('calendar 8C planning cache marker is stale')

          for token in ["version:'8D'", 'window.DiagnostikaCalendarUI=ui', "if(window.DiagnostikaCalendar?.moduleAware!==true)window.DiagnostikaCalendar=ui", 'row.dataset.calendarEventId']:
              if token not in ui:
                  errors.append('calendar 8D UI hardening missing '+token)
          for token in ["version:'8D'", 'calendarApi()?.get?.(id)', 'urlForRow:googleUrl']:
              if token not in google:
                  errors.append('calendar 8D Google bridge hardening missing '+token)
          for token in [
              'client-calendar.js?v=20260919-calendar8d',
              'calendar-google-link.js?v=20260919-calendar8d'
          ]:
              if token not in index:
                  errors.append('calendar 8D asset marker missing '+token)

          print('CALENDAR_8A_STATIC_ERRORS:',errors)
          if errors:
              sys.exit(1)
          PY

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Calendar 8A foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/calendar-8a-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          node tests/calendar-module-8a-audit.mjs
          node tests/calendar-ui-8b-audit.mjs
          node tests/calendar-session-8c-audit.mjs
          node tests/calendar-hardening-8d-audit.mjs
