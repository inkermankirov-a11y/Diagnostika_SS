name: Service boundary audit

on:
  push:
    branches: [main, 'feature-final-*']
    paths:
      - 'DiagnostikaSS.com/core/store-bridge.js'
      - 'DiagnostikaSS.com/core/shell-bridge.js'
      - 'DiagnostikaSS.com/core/bootstrap.js'
      - 'DiagnostikaSS.com/modules/**'
      - 'DiagnostikaSS.com/app-loader.js'
      - 'DiagnostikaSS.com/index.html'
      - 'DiagnostikaSS.com/tests/service-boundary-*.mjs'
      - '.github/workflows/service-boundary-audit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: DiagnostikaSS.com

jobs:
  service-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify service and CORE boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check core/store-bridge.js
          node --check core/shell-bridge.js
          node --check tests/service-boundary-23c-audit.mjs
          node tests/service-boundary-23c-audit.mjs
