name: Release production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://inkermankirov-a11y.github.io/Diagnostika_SS/
      REQUIRE_RELEASE_MARKER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Static release checks
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/release-16a-production-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import sys

          index=Path('index.html').read_text(encoding='utf-8')
          notes=Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          errors=[]

          if '<meta name="diagnostika-release" content="v1.0.0">' not in index:
              errors.append('v1.0.0 release marker missing from index')
          if '# Diagnostika v1.0.0' not in notes:
              errors.append('v1.0.0 release notes missing')
          if 'RELEASE 16A' not in notes:
              errors.append('release acceptance section missing')

          print('RELEASE_16A_STATIC_ERRORS:',errors)
          if errors:
              sys.exit(1)
          PY

      - name: Wait for this commit to reach GitHub Pages
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 90); do
            deployments=$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=10")

            deployment_id=$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json,os
          rows=json.loads(os.environ.get('DEPLOYMENTS','[]'))
          print(rows[0]['id'] if rows else '')
          PY
            )

            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 "${api}/deployments/${deployment_id}/statuses?per_page=10")
              state=$(STATUSES="$statuses" python3 - <<'PY'
          import json,os
          rows=json.loads(os.environ.get('STATUSES','[]'))
          print(rows[0].get('state','') if rows else '')
          PY
              )
              echo "Pages deployment ${deployment_id}: ${state:-pending}"
              if [ "$state" = "success" ]; then exit 0; fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            else
              echo "Pages deployment for ${TARGET_SHA} not created yet"
            fi
            sleep 5
          done
          echo "Timed out waiting for GitHub Pages deployment for ${TARGET_SHA}" >&2
          exit 1

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed production user flow
        run: node tests/release-16a-production-smoke.mjs
