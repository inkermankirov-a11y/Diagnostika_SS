name: Diagnosis unsaved editor audit

on:
  push:
    branches: [main, 'feature-diagnosis-*']
    paths:
      - 'app.js'
      - 'app-dialogs.js'
      - 'index.html'
      - 'modules/diagnosis/ui/**'
      - 'tests/diagnosis-unsaved-editor-audit.mjs'
      - '.github/workflows/diagnosis-unsaved-editor-audit.yml'
  workflow_dispatch:

jobs:
  unsaved-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          node --check app.js
          node --check app-dialogs.js
          node --check modules/diagnosis/ui/add-focus.js
          node --check modules/diagnosis/ui/situation-create.js
          node --check modules/diagnosis/ui/secondary-feeling-hints.js
          node --check modules/diagnosis/ui/compact-client.js
          node --check tests/diagnosis-unsaved-editor-audit.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify unsaved editor protection
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/unsaved-editor-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node tests/diagnosis-unsaved-editor-audit.mjs
