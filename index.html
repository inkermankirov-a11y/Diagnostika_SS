<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Психологическая диагностика</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>Психологическая диагностика</h1>
    <div class="top-actions">
      <button id="saveHistoryBtn" class="btn btn-green">Сохранить в историю</button>
      <button id="exportTxtBtn" class="btn btn-blue">Сохранить TXT</button>
    </div>
  </header>

  <main class="main-grid">
    <aside class="client-box">
      <div class="box-title">КЛИЕНТ</div>
      <div class="client-select-row">
        <select id="clientSelect"></select>
        <button id="addClientBtn" class="tiny-btn" title="Добавить клиента">+</button>
      </div>

      <div class="client-card-row">
        <div class="photo-wrap">
          <img id="clientPhoto" alt="Фото клиента">
          <div id="photoPlaceholder">Фото</div>
          <input id="photoInput" type="file" accept="image/*" hidden>
        </div>
        <div class="client-mini-form">
          <label>ФИО<input id="clientName"></label>
          <div class="two-cols">
            <label>Город<input id="clientCity"></label>
            <label>Возраст<input id="clientAge" type="number" min="0" max="120"></label>
          </div>
          <button id="saveClientBtn" class="soft-btn">Сохранить данные</button>
          <button id="clientBaseBtn" class="soft-btn">База клиентов</button>
        </div>
      </div>

      <div class="social-row">
        <button id="vkBtn" class="social vk">B</button>
        <button id="tgBtn" class="social tg">➤</button>
        <button id="maxBtn" class="social max">◉</button>
      </div>

      <div class="work-title">РАБОТА С КЛИЕНТОМ</div>
      <div class="work-tabs">
        <button class="work-tab active" data-view="card">Карточка клиента</button>
        <button class="work-tab" data-view="diagnosis">Диагностика</button>
      </div>

      <div id="requestSidebar" class="request-sidebar hidden">
        <hr>
        <div class="box-title">ЗАПРОСЫ КЛИЕНТА</div>
        <div class="request-row">
          <select id="requestSelect"></select>
          <button id="addRequestBtn" class="soft-btn">+ Добавить запрос</button>
          <button id="deleteRequestBtn" class="soft-btn">Удалить запрос</button>
        </div>
        <div class="sub-title">ОБЩИЙ ЗАПРОС</div>
        <textarea id="requestTitle" rows="2"></textarea>
        <div class="sub-title">СИТУАЦИИ</div>
        <div id="situationList" class="situation-list"></div>
        <div class="situation-actions">
          <button id="addSituationBtn" class="soft-btn">+ Добавить</button>
          <button id="editSituationBtn" class="soft-btn">Изменить</button>
          <button id="deleteSituationBtn" class="soft-btn">Удалить</button>
        </div>
        <button id="hintBtn" class="soft-btn hint-btn">Подсказки — убеждения 1</button>
      </div>
    </aside>

    <section id="cardView" class="content-card">
      <h2>КАРТА КЛИЕНТА</h2>
      <div id="cardClientName" class="client-heading"></div>
      <p class="muted-line">Здесь история работы и прогресс клиента.</p>
      <div class="history-toolbar">
        <h3>СЕССИИ</h3>
        <button id="addSessionBtn" class="soft-btn">+ Добавить сессию</button>
      </div>
      <div id="sessions" class="sessions"></div>
    </section>

    <section id="diagnosisView" class="diagnosis-grid hidden">
      <div class="tree-panel">
        <div id="situationTitle" class="situation-title">Выберите ситуацию</div>
        <div id="situationLevel" class="situation-level-label">Дискомфорт: —</div>
        <div id="tree" class="tree"></div>
        <div class="tree-actions">
          <button id="addBeliefBtn" class="soft-btn">+ Убеждение 1</button>
          <button id="addFeelingBtn" class="soft-btn">+ Вторичные чувства</button>
          <button id="addDeepBtn" class="soft-btn">+ Убеждение 2</button>
          <button id="addInstinctBtn" class="soft-btn">+ Инстинкт</button>
          <button id="deleteElementBtn" class="soft-btn">Удалить</button>
        </div>
      </div>

      <aside class="editor-panel">
        <div class="box-title">РЕДАКТОР</div>
        <div id="editorType" class="editor-type">Элемент не выбран</div>
        <textarea id="editorText" rows="3"></textarea>
        <label class="editor-label">Уровень 1–10<input id="editorLevel" type="number" min="1" max="10" value="5"></label>
        <label class="editor-label">Комментарий / уточнение<textarea id="editorComment" rows="3"></textarea></label>
        <button id="saveElementBtn" class="btn btn-blue small-blue">Сохранить элемент</button>
        <div class="result-title">★ ЖЕЛАЕМЫЙ РЕЗУЛЬТАТ СИТУАЦИИ</div>
        <textarea id="situationResult" rows="4"></textarea>
        <button id="saveResultBtn" class="soft-btn">Сохранить результат</button>
      </aside>
    </section>
  </main>
</div>

<template id="sessionTemplate">
  <article class="session-card">
    <div class="session-top">
      <input class="session-date" type="date">
      <select class="session-request-link"></select>
      <button class="delete-session soft-btn">Удалить</button>
    </div>
    <textarea class="session-notes" rows="3" placeholder="Что делали, результат, заметки"></textarea>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
