    <h1><span class="app-title-text"><span>Психологическая</span><span>диагностика</span></span></h1>
    <div class="header-buttons">
      <button id="clientBaseBtn" class="header-btn" style="background:#64748b;color:#fff">База клиентов</button>
      <button id="storageBtn" class="header-btn" style="background:#475569;color:#fff">Хранилище</button>
      <button id="testFillBtn" class="header-btn" style="background:#d97706;color:#fff" hidden>ТЕСТ</button>
      <button id="saveHistoryBtn" class="header-btn green">Сохранить в историю</button>
      <button id="exportTxtBtn" class="header-btn blue">Сохранить TXT</button>
    </div>
  </header>

  <section id="appStartupStatus" role="status" aria-live="polite">
    <h2>Загрузка приложения…</h2>
    <p>Подготавливаем рабочее пространство.</p>
    <button id="appReloadBtn" type="button" hidden>Повторить загрузку</button>
    <noscript>Для работы приложения включите JavaScript. Данные браузера удалять не нужно.</noscript>
  </section>
  <main id="diagnosisWorkspace" class="diagnosis-workspace" aria-label="Диагностика" hidden>
    <aside class="left-panel panel-frame">
      <section id="diagnosisClientHeader" class="inner-frame"></section>
      <section id="diagnosticsLeft" class="diagnostics-left hidden">
        <div class="separator"></div>

        <section class="queries-block diagnosis-main-block diagnosis-request-card" aria-label="Основной запрос">
          <div class="small-section-title diagnosis-subsection-title">ЗАПРОСЫ КЛИЕНТА</div>
          <div class="query-toolbar"><select id="requestSelect"></select><button id="addRequestBtn" class="tk-btn">+ Добавить запрос</button><button id="deleteRequestBtn" class="tk-btn">Удалить запрос</button></div>
          <div class="small-section-title spacer-top diagnosis-block-title diagnosis-request-title">ОСНОВНОЙ ЗАПРОС</div><textarea id="requestTitle" class="text-area compact"></textarea>
        </section>

        <section class="situations-block diagnosis-main-block diagnosis-situations-card" aria-label="Ситуации">
          <div class="small-section-title diagnosis-block-title diagnosis-situations-title">СИТУАЦИИ</div>
          <div id="situationList" class="situation-list"></div>
          <div class="left-footer-actions">
            <div class="situation-buttons"><button id="addSituationBtn" class="tk-btn">+ Добавить</button><button id="editSituationBtn" class="tk-btn">Изменить</button><button id="deleteSituationBtn" class="tk-btn">Удалить</button></div>
            <button id="hintBtn" class="tk-btn hint-btn">Подсказки — первичные убеждения</button>
          </div>
        </section>

        <section id="resultBlock" class="result-block diagnosis-left-result diagnosis-main-block diagnosis-result-card hidden" aria-label="Желаемый результат ситуации">
          <div class="result-title diagnosis-block-title diagnosis-result-title">★ ЖЕЛАЕМЫЙ РЕЗУЛЬТАТ СИТУАЦИИ</div>
          <textarea id="situationResult" class="text-area result-text"></textarea>
          <button id="saveResultBtn" class="tk-btn">Сохранить результат</button>
        </section>
      </section>
    </aside>
    <section id="centerPanel" class="center-panel panel-frame hidden"><div class="center-actions"><button id="addBeliefBtn" class="tk-btn">+ Первичное убеждение</button><button id="addFeelingBtn" class="tk-btn">+ Вторичные чувства</button><button id="addDeepBtn" class="tk-btn">+ Вторичное убеждение</button><button id="deleteElementBtn" class="tk-btn push-right">Удалить</button></div><div id="situationTitle" class="situation-title">Выберите ситуацию</div><div id="situationInfo" class="situation-info"></div><div id="tree" class="tree-view"></div></section>
    <aside id="rightPanel" class="right-panel panel-frame hidden">
      <div class="section-title right-title">РЕДАКТОР</div>
      <div id="elementEditor"><div id="editorType" class="editor-type">Элемент не выбран</div><textarea id="editorText" class="text-area editor-text"></textarea><label class="editor-label">Уровень 1–10<input id="editorLevel" class="level-input" type="number" min="1" max="10" value="5"></label><label class="editor-label">Комментарий / уточнение<textarea id="editorComment" class="text-area editor-comment"></textarea></label><button id="saveElementBtn" class="editor-save-btn">Сохранить элемент</button></div>
      <fieldset id="instinctFrame" class="instinct-frame hidden"><legend>ИНСТИНКТЫ — только для вторичного убеждения</legend><div id="instinctSelectedLabel" class="editor-type">Инстинкт 1</div><select id="instinctCombo"></select><label class="editor-label">Уровень 1–10<input id="instinctLevel" class="level-input" type="number" min="1" max="10" value="5"></label><label class="editor-label">Комментарий / уточнение<input id="instinctComment" class="entry"></label><div class="instinct-actions"><button id="saveInstinctBtn" class="editor-save-btn">Сохранить инстинкт</button><button id="addInstinctBtn" class="tk-btn">+ Добавить инстинкт</button></div></fieldset>
    </aside>
  </main>
